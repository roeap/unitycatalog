server.env=dev

# Enable managed tables so the demo can create a managed table on s3://.
server.managed-table.enabled=true

#
# Local S3 (SeaweedFS) configuration.
#
# This uses the legacy per-bucket *static* credential path. Because a session
# token is provided below, Unity Catalog uses these credentials directly and
# does NOT call AWS STS (which SeaweedFS does not implement). The token only
# selects the static path: since a custom S3 endpoint is in effect
# (AWS_ENDPOINT_URL_S3), the server strips the token before vending, so clients
# receive static access-key/secret credentials (no session token).
#
# The S3 endpoint itself is NOT set here -- it is supplied via the
# AWS_ENDPOINT_URL_S3 environment variable (see compose.yaml), which the AWS
# SDK reads automatically. The server enables S3 path-style addressing whenever
# that endpoint variable is present, as SeaweedFS requires path-style.
#
s3.bucketPath.0=s3://uc-demo/
s3.region.0=us-east-1
s3.accessKey.0=seaweedfsadmin
s3.secretKey.0=seaweedfssecret
# A non-empty session token selects the static credential generator (no STS).
s3.sessionToken.0=local-seaweedfs
